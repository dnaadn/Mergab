spring.application.name=Mergab

spring.datasource.url=jdbc:mysql://localhost:3306/Mergab
spring.datasource.username=root
spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



#spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
logging.level.org.springframework.security=DEBUG





mirqab.ai.base-url=http://127.0.0.1:8001
mirqab.ai.analyze-path=/analyze
mirqab.ai.connect-timeout=5s
mirqab.ai.read-timeout=60s
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Email (Gmail) - set MAIL_USERNAME and MAIL_PASSWORD (App Password) in Run Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp (UltraMsg) - the values come from environment variables, don't put real tokens here
# Without them, messages are only printed in the console
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api-url=https://api.ultramsg.com
whatsapp.instance-id=${ULTRAMSG_INSTANCE_ID:}
whatsapp.token=${ULTRAMSG_TOKEN:}
